<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030A12">
  <title>MASS Dispatch — Top-Notch Garage Doors</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div class="app-shell">
    <aside class="rail" aria-label="Primary navigation">
      <a class="product-lockup" href="#pulse" aria-label="MASS Dispatch home">
        <img src="/assets/brands/mass-hq.png" alt="MASS HQ">
        <span><b>MASS</b><small>DISPATCH</small></span>
      </a>
      <nav id="primary-nav"></nav>
      <div class="tenant-lockup">
        <img src="/assets/brands/tngd-primary.png" alt="Top-Notch Garage Doors">
        <div><b>NITRO 4X <i>|</i> DISPATCH</b><span>Together, not going down</span></div>
      </div>
    </aside>

    <section class="product">
      <header class="topbar">
        <div>
          <div class="eyebrow"><span class="preview-dot"></span> PRE-LAUNCH / LIVE QA</div>
          <h1 id="page-title">Operational Pulse</h1>
          <p id="page-date"></p>
        </div>
        <label class="command-search"><span>⌕</span><input type="search" placeholder="Search customers, jobs, technicians, invoices…" aria-label="Search Dispatch"><kbd>⌘K</kbd></label>
        <div class="top-actions">
          <label class="role-control">View as
            <select id="role-select" aria-label="Preview role">
              <option value="technician">Technician</option>
              <option value="dispatcher">Dispatcher</option>
              <option value="administrator">Administrator</option>
            </select>
          </label>
          <button class="icon-button" type="button" aria-label="Messages">▱<i>3</i></button>
          <button class="icon-button" type="button" aria-label="Notifications">♧<i>2</i></button>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">◐</button>
          <button class="profile" type="button"><span class="avatar" id="profile-avatar">QA</span><span><b id="profile-name">Authorized user</b><small id="role-label">Loading role</small></span></button>
        </div>
      </header>

      <main id="workspace" tabindex="-1" aria-live="polite">
        <section class="loading-state state-panel"><span class="spinner"></span><h2>Assembling Dispatch</h2><p>Loading the accepted capability map.</p></section>
      </main>

      <footer class="statusbar">
        <span><i class="status-dot"></i> Application boundary ready</span>
        <span id="provider-status">Provider status loading</span>
        <span>Dispatch V1 · Nitro 4X</span>
      </footer>
    </section>
  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
